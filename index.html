<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BFF Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--sky:#7dc4f5;--cloud:#f6faff;--pink:#f59cb8;--ink:#4a3535;--gold:#ffd966;--card:#fff;--ok:#5bc48a;--no:#ef7a7a;--bg1:#9fd4f8;--bg2:#f6faff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f3e9e9;--card:#243449;--bg1:#1d3a5c;--bg2:#16243a;--cloud:#16243a}}
:root[data-theme="dark"]{--ink:#f3e9e9;--card:#243449;--bg1:#1d3a5c;--bg2:#16243a;--cloud:#16243a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2) 60%);background-color:var(--bg2)}
main{max-width:480px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(44px,13vw,64px);line-height:.95;margin:6px 0 4px;text-align:center;font-weight:800;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.5px}
h1 .p{color:var(--pink)}
.sub{text-align:center;font-size:18px;margin:0 0 22px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--ink)}
label{font-weight:700;display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--cloud);color:var(--ink)}
button{font:inherit;font-weight:800;font-size:19px;cursor:pointer;border:3px solid var(--ink);border-radius:18px;padding:10px 18px;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:0}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button.alt{background:var(--sky)}
.full{width:100%;margin-top:14px}
.bar{height:14px;border:3px solid var(--ink);border-radius:99px;background:var(--cloud);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.q{font-size:23px;font-weight:800;line-height:1.2;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:0 0 10px;background:var(--cloud);color:var(--ink);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.opt.sel{background:var(--gold)}
.opt.ok{background:var(--ok);color:#fff}
.opt.no{background:var(--no);color:#fff}
.opt.mine{outline:4px dashed var(--ink);outline-offset:2px}
.score{font-size:68px;font-weight:800;text-align:center;line-height:1;margin:6px 0}
.msg{text-align:center;font-size:20px;font-weight:700;margin:0 0 6px}
.hint{font-size:15px;opacity:.8;text-align:center;margin:12px 0 0}
.row{display:flex;gap:10px}.row button{flex:1}.row input{flex:1;min-width:0}.row .mini{flex:0 0 auto;padding:6px 12px;background:var(--cloud);color:var(--ink)}
.qe{border:3px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:14px;background:var(--cloud)}.qe input{margin-top:8px;background:var(--card)}.qe .row input{margin-top:0;font-weight:700}
.rank{list-style:none;padding:0;margin:0 0 6px}.rank li{display:flex;justify-content:space-between;gap:10px;font-size:20px;font-weight:700;padding:8px 12px;border:3px solid var(--ink);border-radius:16px;margin-bottom:8px;background:var(--cloud)}.rank li:first-child{background:var(--gold)}.rank span:first-child{overflow-wrap:anywhere}
.er{color:var(--no);font-weight:700;text-align:center;margin:10px 0 0;min-height:1em}textarea{font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.logo{position:relative;isolation:isolate;font-size:clamp(60px,19vw,84px);height:2.45em;margin:0 0 4px}
.w{position:absolute;left:50%;font-weight:800;line-height:.9;white-space:nowrap;-webkit-text-stroke:.11em var(--ink);paint-order:stroke fill;margin:0}
.w::before{content:attr(data-t);position:absolute;inset:0;color:#fff;-webkit-text-stroke:.26em #fff;z-index:-1}
.w.b{top:.05em;color:#fff;transform:translateX(-50%) rotate(-4deg)}
.w.t{top:.92em;color:var(--pink);transform:translateX(-50%) rotate(3deg)}
.w.s{top:1.86em;font-size:.34em;color:var(--sky);-webkit-text-stroke:.14em var(--ink);transform:translateX(-50%) rotate(-2deg)}
.w.s::before{-webkit-text-stroke:.34em #fff}
.sp{position:absolute;color:var(--gold);font-size:.32em;line-height:1;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;z-index:1}
.mate{position:absolute;z-index:3;width:1.1em;height:1.1em;border:4px dashed var(--ink);border-radius:50%;background:rgba(255,255,255,.6) center/contain no-repeat;display:grid;place-items:center;font-size:inherit;cursor:pointer;text-align:center}
.mate span{font-size:14px;font-weight:800;color:var(--ink);line-height:1.1}
.mate input{position:absolute;opacity:0;width:1px;height:1px}
.mate:focus-within{outline:4px solid var(--gold);outline-offset:2px}
.mate.has{border:0;background-color:transparent}.mate.has span{display:none}
.mate.l{left:0;top:.75em}.mate.r{right:0;top:1.05em}
.mate.has{border:5px solid #fff;box-shadow:0 0 0 3px var(--ink),0 4px 0 3px var(--ink);background-size:cover}
.mate.r.wide{width:1.45em;height:.82em;border-radius:16px;top:.12em}
.rank li{display:block;padding:0}.rank summary{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;cursor:pointer;list-style:none}.rank summary::-webkit-details-marker{display:none}
.rank li.me{outline:3px dashed var(--ink);outline-offset:2px}.rank details>*:not(summary){padding:0 12px 10px;margin:0;font-size:16px;font-weight:600}.rank .st{font-weight:800}.rank .det p{margin:0 0 10px}
.yes{color:var(--ok)}.nope{color:var(--no)}
.pct{font-size:60px;font-weight:800;text-align:center;line-height:1}
.track{position:relative;height:26px;border:4px solid var(--ink);border-radius:99px;margin:30px 8px 8px;background:linear-gradient(90deg,#ef7a7a 0 20%,#ffb066 20% 50%,#7dc4f5 50% 80%,#f59cb8 80% 100%)}
.track .mask{position:absolute;top:0;bottom:0;right:0;width:100%;background:var(--card);opacity:.78;border-radius:0 99px 99px 0}
.track .knob{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid var(--ink);border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--ink)}
.ticks{display:flex;margin:0 8px;font-size:12px;font-weight:700;text-align:center;gap:2px}
.stage{text-align:center;font-size:22px;font-weight:800;margin:14px 0 4px;min-height:2.2em}.stage span{display:inline-block;padding:2px 16px;border:3px solid var(--ink);border-radius:20px;color:#4a3535}
.tabs{display:flex;gap:10px;margin-bottom:16px}.tabs button{flex:1;font-size:17px;background:var(--cloud);color:var(--ink)}.tabs button[aria-pressed="true"]{background:var(--pink);color:#fff}
.bl{list-style:none;padding:0;margin:0 0 8px}.bq{border:3px solid var(--ink);border-radius:18px;padding:10px 12px;margin-bottom:12px;background:var(--cloud)}.bq small{display:block;font-size:15px;font-weight:600;margin:2px 0 8px}
</style>
</head>

<script>
var DEF=[
["Món ăn mình có thể ăn cả tuần không chán?",["Mì / phở","Cơm","Đồ chiên rán","Đồ ngọt"]],
["Cuối tuần lý tưởng của mình là?",["Ngủ nướng cả ngày","Đi chơi với bạn","Cày phim / game","Đi cà phê một mình"]],
["Mình hay trễ hẹn vì?",["Ngủ quên","Chọn đồ lâu","Kẹt xe","Mình không bao giờ trễ"]],
["Khi buồn mình thường?",["Ăn thật nhiều","Nằm im nghe nhạc","Rủ bạn đi chơi","Ngủ"]],
["Thứ mình sợ nhất?",["Gián / côn trùng","Chỗ cao","Ma","Bị deadline dí"]],
["Tin nhắn mình trả lời kiểu?",["Trả ngay lập tức","Vài tiếng sau","Đọc rồi quên","Toàn gửi sticker"]],
["Đồ uống mình hay gọi?",["Trà sữa","Cà phê","Nước ép / sinh tố","Nước lọc"]],
["Nếu trúng số mình sẽ?",["Đi du lịch vòng quanh","Mua nhà","Đãi bạn bè","Gửi tiết kiệm"]],
["Tính cách mình giống nhất?",["Hài hước","Trầm tính","Hay lo xa","Nói nhiều"]],
["Điều làm mình giận nhất?",["Bị cho leo cây","Bị đọc tin không trả lời","Bị nói dối","Bị đói"]]
];
var QS=[],MAX=20,app=document.getElementById("app"),sub=document.getElementById("sub");
function clone(a){return a.map(function(q){return [q[0],q[1].slice()]})}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function base(){return location.href.split("#")[0]}
function bar(i){return '<div class="bar"><i style="width:'+(i/QS.length*100)+'%"></i></div>'}
function opts(i){return QS[i][1].map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'}).join("")}
function copy(id,out){var t=document.getElementById(id),ok=false;t.select();try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).catch(function(){});document.getElementById(out).textContent="Đã sao chép! Nếu chưa được, giữ vào ô link để chọn rồi copy."}

function store(){try{return JSON.parse(localStorage.getItem("bff.quizzes")||"[]")}catch(e){return[]}}
function put(l){try{localStorage.setItem("bff.quizzes",JSON.stringify(l))}catch(e){}}
function qid(n,q,a){var s=n+JSON.stringify(q||DEF)+JSON.stringify(a),h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function saveQuiz(o){var l=store().filter(function(x){return x.id!==o.id});l.unshift(o);put(l)}
function findQuiz(id){return store().filter(function(x){return x.id===id})[0]||null}
function clearHash(){history.replaceState(null,"",location.pathname+location.search)}
function home(tab){
 QS=clone(DEF);var l=store();tab=tab||(l.length?"list":"new");
 sub.textContent="Test xem mi hiểu ta không";
 var h='<div class="tabs"><button data-t="new" aria-pressed="'+(tab==="new")+'">Tạo mới</button><button data-t="list" aria-pressed="'+(tab==="list")+'">Bài đã tạo ('+l.length+')</button></div>';
 if(tab==="new"){
  h+='<div class="card"><label for="nm">Tên của bạn</label><input id="nm" maxlength="20" placeholder="Ví dụ: Mi" autocomplete="off"><button class="full" id="go">Chọn câu hỏi</button><p class="hint">Dùng 10 câu mẫu hoặc tự sửa, thêm, xóa câu hỏi. Sau đó bạn trả lời và gửi link cho bạn bè đoán.</p></div>';
 }else if(!l.length){
  h+='<div class="card"><p class="msg">Chưa có bài nào</p><p class="hint">Bài bạn tạo sẽ được lưu ở đây để xem lại bảng xếp hạng.</p><button class="full" data-t="new">Tạo bài đầu tiên</button></div>';
 }else{
  h+='<div class="card"><p class="msg">Các bài bạn đã tạo</p><ul class="bl">'+l.map(function(o){
   var e=(o.e||[]).slice().sort(function(x,y){return y[1]-x[1]}),m=o.q.length,top=e.length?'Hạng 1: '+esc(e[0][0])+' '+Math.round(e[0][1]/m*100)+'%':'Chưa ai chơi';
   return '<li class="bq"><b>Bài của '+esc(o.n)+'</b><small>'+m+' câu · '+e.length+' người đã chơi · '+top+' · '+new Date(o.ts||0).toLocaleDateString("vi-VN")+'</small><div class="row"><button data-o="'+o.id+'">Xem bảng xếp hạng</button><button class="mini" data-d="'+o.id+'" aria-label="Xóa bài của '+esc(o.n)+'">Xóa</button></div></li>'}).join("")+'</ul><p class="hint">Danh sách lưu trong trình duyệt này. Đổi máy hoặc xóa dữ liệu trình duyệt thì sẽ mất, nên bạn hãy giữ lại link bảng xếp hạng.</p></div>';
 }
 app.innerHTML=h;
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){home(b.dataset.t)}});
 app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){var o=findQuiz(b.dataset.o);if(o)board({t:o.n,m:o.q.length,q:o.q,a:o.a,e:o.e||[]})}});
 app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){
  if(b.dataset.sure){put(store().filter(function(x){return x.id!==b.dataset.d}));home("list");return}
  b.dataset.sure="1";b.textContent="Bấm lần nữa để xóa";
 }});
 var go=document.getElementById("go");
 if(go)go.onclick=function(){var n=document.getElementById("nm").value.trim();if(!n){document.getElementById("nm").focus();return}edit(n)};
}
function edit(n){
 sub.textContent="Câu hỏi của "+n;
 var h='<div class="card"><p class="msg">Sửa, xóa hoặc thêm câu hỏi</p>';
 QS.forEach(function(q,i){
  h+='<div class="qe"><div class="row"><input data-i="'+i+'" data-j="-1" value="'+esc(q[0])+'" aria-label="Câu hỏi '+(i+1)+'" maxlength="120"><button class="mini" data-del="'+i+'" aria-label="Xóa câu '+(i+1)+'">✕</button></div>';
  for(var j=0;j<4;j++)h+='<input data-i="'+i+'" data-j="'+j+'" value="'+esc(q[1][j]||"")+'" maxlength="50" placeholder="Đáp án '+(j+1)+(j>1?" (có thể bỏ trống)":"")+'">';
  h+='</div>';
 });
 h+='<button class="alt full" id="add"'+(QS.length>=MAX?' disabled':'')+'>+ Thêm câu hỏi ('+QS.length+'/'+MAX+')</button><button class="alt full" id="rs">Dùng lại bộ câu mẫu</button><button class="full" id="ok">Xong, tới lượt trả lời</button><p class="er" id="er"></p></div>';
 app.innerHTML=h;
 app.querySelectorAll("input").forEach(function(el){el.oninput=function(){var i=+el.dataset.i,j=+el.dataset.j;if(j<0)QS[i][0]=el.value;else QS[i][1][j]=el.value}});
 app.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){QS.splice(+b.dataset.del,1);edit(n)}});
 document.getElementById("add").onclick=function(){QS.push(["",["","","",""]]);edit(n)};
 document.getElementById("rs").onclick=function(){QS=clone(DEF);edit(n)};
 document.getElementById("ok").onclick=function(){
  var c=QS.map(function(q){return [q[0].trim(),q[1].map(function(o){return o.trim()}).filter(Boolean)]}).filter(function(q){return q[0]&&q[1].length>=2});
  if(!c.length){document.getElementById("er").textContent="Cần ít nhất 1 câu hỏi có từ 2 đáp án trở lên.";return}
  QS=c;create(n,0,[]);
 };
}
function create(n,i,a){
 if(i>=QS.length)return share(n,a);
 sub.textContent="Trả lời về chính bạn nhé";
 app.innerHTML='<div class="card">'+bar(i)+'<p class="q">'+(i+1)+'/'+QS.length+'. '+esc(QS[i][0])+'</p>'+opts(i)+'</div>';
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){create(n,i+1,a.concat([+b.dataset.k]))}});
}
function share(n,a){
 var link=base()+"#"+enc({n:n,q:QS,a:a});
 saveQuiz({id:qid(n,QS,a),n:n,q:QS,a:a,e:[],ts:Date.now()});
 sub.textContent="Xong rồi, "+n+"!";
 app.innerHTML='<div class="card"><p class="msg">Gửi link này cho bạn bè nhé</p><textarea id="lk" rows="4" readonly>'+esc(link)+'</textarea><button class="full" id="cp">Sao chép link</button><p class="hint" id="ct">Bạn bè mở link là chơi được ngay. Chơi xong họ có điểm và bảng xếp hạng liền, rồi gửi link kết quả lại cho bạn. Bạn mở link đó là xem được họ đã chọn gì.</p><button class="full alt" id="back">Về trang chính, xem bài đã tạo</button></div>';
 document.getElementById("cp").onclick=function(){copy("lk","ct")};
 document.getElementById("back").onclick=function(){clearHash();home("list")};
}
function stage(p){return p<20?["Fake friend","#ef7a7a"]:p<50?["Bạn hờ","#ffb066"]:p<80?["Bạn hơi thân","#7dc4f5"]:["Ôi bạn iu, tui khóc mất 😭💖","#f59cb8"]}
function gaugeHTML(){return '<div class="gauge" id="g"><div class="pct" aria-hidden="true">0%</div><div class="track" aria-hidden="true"><div class="mask"></div><div class="knob"></div></div><div class="ticks" aria-hidden="true"><span style="flex:20">Fake friend</span><span style="flex:30">Bạn hờ</span><span style="flex:30">Hơi thân</span><span style="flex:20">Bạn iu</span></div><div class="stage" aria-hidden="true"></div></div>'}
function gauge(target){
 var g=document.getElementById("g"),kn=g.querySelector(".knob"),mk=g.querySelector(".mask"),pc=g.querySelector(".pct"),st=g.querySelector(".stage");
 g.setAttribute("role","img");g.setAttribute("aria-label","Độ hiểu nhau "+target+"%: "+stage(target)[0]);
 function set(p){kn.style.left=p+"%";mk.style.width=(100-p)+"%";pc.textContent=Math.round(p)+"%";var x=stage(Math.round(p));st.innerHTML='<span style="background:'+x[1]+'">'+x[0]+'</span>'}
 if(target===0||matchMedia("(prefers-reduced-motion:reduce)").matches){set(target);return}
 var t0=null,dur=900+target*20;
 function f(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);set(target*e);if(k<1)requestAnimationFrame(f);else set(target)}
 set(0);requestAnimationFrame(f);
}
function sortE(b){b.e.sort(function(x,y){return y[1]-x[1]||x[0].localeCompare(y[0])})}
function clean(b){b.m=+b.m||10;b.e=b.e.map(function(p){return [String(p[0]).slice(0,20),Math.max(0,Math.min(b.m,+p[1]||0)),Array.isArray(p[2])?p[2].slice(0,40):null]});sortE(b)}
function rankHTML(b,me){
 var med=["🥇","🥈","🥉"];
 return '<ol class="rank">'+b.e.map(function(p,i){
  var pc=Math.round(p[1]/b.m*100),x=stage(pc),det="";
  if(b.q&&b.a&&p[2]){det='<div class="det">'+b.q.map(function(q,k){var g=p[2][k],r=b.a[k],ok=g===r;return '<p><b>'+esc(q[0])+'</b><br>'+esc(b.t)+' chọn: '+esc(q[1][r]||"?")+'<br>'+esc(p[0])+' đoán: <span class="'+(ok?"yes":"nope")+'">'+esc(q[1][g]||"?")+(ok?" ✓":" ✗")+'</span></p>'}).join("")+'</div>'}
  return '<li'+(p[0]===me?' class="me"':'')+'><details><summary><span>'+(med[i]||(i+1)+'.')+' '+esc(p[0])+'</span><span>'+p[1]+'/'+b.m+' · '+pc+'%</span></summary><p class="st">'+esc(x[0])+'</p>'+det+'</details></li>'}).join("")+'</ol>';
}
function play(d){
 QS=d.q||DEF;sub.textContent="Bạn hiểu "+d.n+" đến mức nào?";
 app.innerHTML='<div class="card"><label for="nm">Tên của bạn</label><input id="nm" maxlength="20" placeholder="Tên bạn là gì?" autocomplete="off"><button class="full" id="go">Bắt đầu đoán</button><p class="hint">'+esc(d.n)+' đã chuẩn bị '+QS.length+' câu. Bạn đoán đúng được mấy câu?</p></div>';
 document.getElementById("go").onclick=function(){ask(d,document.getElementById("nm").value.trim()||"Bạn",0,0,[])};
}
function ask(d,me,i,s,gs){
 if(i>=QS.length)return result(d,me,s,gs);
 app.innerHTML='<div class="card">'+bar(i)+'<p class="q">'+(i+1)+'/'+QS.length+'. '+esc(d.n)+': “'+esc(QS[i][0])+'”</p>'+opts(i)+'</div>';
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
  var k=+b.dataset.k,right=d.a[i],good=k===right;
  app.querySelectorAll(".opt").forEach(function(o){o.disabled=true;var q=+o.dataset.k;if(q===right)o.classList.add("ok");else if(q===k)o.classList.add("no")});
  var nx=document.createElement("button");nx.className="full alt";nx.textContent=good?"Đúng rồi! Câu tiếp":(d.n+" chọn khác cơ. Câu tiếp");
  app.firstChild.appendChild(nx);nx.focus();
  nx.onclick=function(){ask(d,me,i+1,s+(good?1:0),gs.concat([k]))};
 }});
}
function result(d,me,s,gs){
 var m=QS.length,pc=Math.round(s/m*100);
 var e=(d.e||[]).filter(function(p){return String(p[0]).toLowerCase()!==me.toLowerCase()});
 e.push([me,s,gs]);
 var b={t:d.n,m:m,q:QS,a:d.a,e:e};clean(b);
 var link=base()+"#"+enc(b);
 sub.textContent=me+" hiểu "+d.n+":";
 app.innerHTML='<div class="card">'+gaugeHTML()+'<p class="msg">'+s+'/'+m+' câu đúng</p></div>'+
 '<div class="card" style="margin-top:22px"><p class="msg">Bảng xếp hạng</p>'+rankHTML(b,me)+'<p class="hint">Bấm vào tên để xem từng câu. Bảng gồm những người đã chơi và được gộp trong link.</p></div>'+
 '<div class="card" style="margin-top:22px"><label for="lk">Link kết quả, gửi cho '+esc(d.n)+' để xem bạn chọn gì</label><textarea id="lk" rows="3" readonly>'+esc(link)+'</textarea><button class="full" id="cp">Sao chép link kết quả</button><p class="hint" id="ct"></p><button class="full alt" id="again">Đoán lại</button><button class="full alt" id="mine">Tạo bài test của riêng mình</button></div>';
 gauge(pc);
 document.getElementById("cp").onclick=function(){copy("lk","ct")};
 document.getElementById("again").onclick=function(){ask(d,me,0,0,[])};
 document.getElementById("mine").onclick=function(){clearHash();home("new")};
}
function merge(b,txt){
 var add=0;
 (txt.match(/\S+/g)||[]).forEach(function(u){
  var h=u.split("#")[1],x;if(!h)return;
  try{x=dec(h)}catch(e){return}
  if(!x||!x.e)return;
  if(!b.q&&x.q)b.q=x.q;if(!b.a&&x.a)b.a=x.a;
  x.e.forEach(function(p){
   var nm=String(p[0]).slice(0,20),f=false;
   b.e.forEach(function(q,k){if(q[0].toLowerCase()===nm.toLowerCase()){b.e[k]=p;f=true}});
   if(!f)b.e.push(p);add++;
  });
 });
 return add;
}
function board(b){
 clean(b);
 var id=b.a?qid(b.t,b.q,b.a):null,st=id?findQuiz(id):null;
 if(st){var ex={};b.e.forEach(function(p){ex[p[0].toLowerCase()]=1});(st.e||[]).forEach(function(p){if(!ex[String(p[0]).toLowerCase()])b.e.push(p)});clean(b);st.e=b.e;saveQuiz(st)}
 sub.textContent="Ai hiểu "+b.t+" nhất?";
 var link=base()+"#"+enc(b),pl=b.q&&b.a?base()+"#"+enc({n:b.t,q:b.q,a:b.a,e:b.e}):"";
 var sv=!id?'':st?'<p class="hint">Bài này đã được lưu trong danh sách của bạn, kết quả thêm vào sẽ tự lưu.</p>':'<button class="full alt" id="sv">Lưu bài này vào danh sách của mình</button>';
 app.innerHTML='<div class="card"><p class="msg">Bảng xếp hạng</p>'+(b.e.length?rankHTML(b,""):'<p class="hint">Chưa ai chơi. Gửi link mời cho bạn bè nhé.</p>')+'<p class="hint">Bấm vào tên để xem '+(b.q&&b.a?'từng câu họ đoán so với lựa chọn của '+esc(b.t):'điểm chi tiết')+'.</p>'+sv+'<label for="pz">Thêm kết quả: dán link của bạn khác</label><textarea id="pz" rows="3" placeholder="Dán một hoặc nhiều link kết quả"></textarea><button class="full alt" id="ad">Thêm vào bảng</button><p class="er" id="er"></p><label for="lk">Link bảng xếp hạng</label><textarea id="lk" rows="3" readonly>'+esc(link)+'</textarea><button class="full" id="cp">Sao chép link bảng</button><p class="hint" id="ct"></p>'+(pl?'<label for="pl">Link mời bạn khác chơi, kèm bảng xếp hạng hiện tại</label><textarea id="pl" rows="3" readonly>'+esc(pl)+'</textarea><button class="full" id="cp2">Sao chép link mời</button><p class="hint" id="pt"></p>':'')+'<button class="full alt" id="mine">Về trang chính</button></div>';
 document.getElementById("cp").onclick=function(){copy("lk","ct")};
 if(pl)document.getElementById("cp2").onclick=function(){copy("pl","pt")};
 var sb=document.getElementById("sv");
 if(sb)sb.onclick=function(){saveQuiz({id:id,n:b.t,q:b.q,a:b.a,e:b.e,ts:Date.now()});board(b)};
 document.getElementById("ad").onclick=function(){
  if(!merge(b,document.getElementById("pz").value)){document.getElementById("er").textContent="Chưa thấy link kết quả hợp lệ nào.";return}
  board(b);
 };
 document.getElementById("mine").onclick=function(){clearHash();home("list")};
}
(function(){
 var h=location.hash.slice(1),d=null;
 try{if(h)d=dec(h)}catch(e){}
 if(d&&d.e&&d.t)board(d);
 else if(d&&d.n&&d.a&&d.a.length===(d.q||DEF).length)play(d);
 else home();
})();
document.querySelectorAll(".mate").forEach(function(m){var f=m.querySelector("input");f.onchange=function(){if(!f.files[0])return;var r=new FileReader();r.onload=function(){m.style.backgroundImage="url("+r.result+")";m.classList.add("has")};r.readAsDataURL(f.files[0])}});
</script>
</body>
</html>
